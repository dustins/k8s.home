name: Renovate

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: docker
    container:
      image: renovate/renovate:44
      volumes:
      - /etc/ssl/certs/swigg-ca-bundle.pem:/etc/ssl/certs/swigg-ca-bundle.pem:ro

    steps:
      - name: Run Renovate
        run: renovate
        env:
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: ${{ forgejo.server_url }}/api/v1/
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_BOT_PAT }}
          RENOVATE_REPOSITORIES: ${{ forgejo.repository }}
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <renovate-bot@users.noreply.forgejo>'
          LOG_LEVEL: info
          # If your Forgejo instance uses an internal/self-signed CA,
          # mount it and point Node at it (Renovate is Node-based, so this
          # is NODE_EXTRA_CA_CERTS, not SSL_CERT_FILE like your Nix runner setup):
          # NODE_EXTRA_CA_CERTS: /etc/ssl/certs/internal-ca.pem
          NODE_EXTRA_CA_CERTS: /etc/ssl/certs/swigg-ca-bundle.pem

