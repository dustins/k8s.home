gateway:
  listeners:
    websecure:
      # -- Port is the network port. Multiple listeners may use the same port, subject to the Listener compatibility rules.
      # The port must match a port declared in ports section.
      port: 443

ingressRoute:
  dashboard:
    # -- Create an IngressRoute for the dashboard
    enabled: true
    # -- The router match rule used for the dashboard ingressRoute
    matchRule: Host(`traefik.k8s.home`)
    # -- Specify the allowed entrypoints to use for the dashboard ingress route, (e.g. traefik, web, websecure).
    # By default, it's using traefik entrypoint, which is not exposed.
    # /!\ Do not expose your dashboard without any protection over the internet /!\
    entryPoints: [ "traefik", "web", "websecure" ]

  healthcheck:
    # -- Create an IngressRoute for the healthcheck probe
    enabled: false
    matchRule: Host(`traefik.k8s.home`) && PathPrefix(`/ping`)
    entryPoints: [ "traefik", "web", "websecure" ]

providers:
  kubernetesCRD:
    # -- Allows IngressRoute to reference resources in namespace other than theirs
    allowCrossNamespace: true

deployment:
  additionalVolumes:
  - name: technitium-token
    hostPath:
      path: /run/secrets/services/traefik/technitiumApiToken
      type: File
  - name: ca-certs
    hostPath:
      path: /etc/ssl/certs/ca-bundle.crt
      type: File

additionalArguments:
- "--serverstransport.insecureskipverify=true"
- "--entrypoints.websecure.http.tls.certResolver=swigg-ca"
- "--entrypoints.websecure.http.tls.domains[0].main=k8s.home"
- "--entrypoints.websecure.http.tls.domains[0].sans=*.k8s.home"

additionalVolumeMounts:
- name: technitium-token
  mountPath: /run/secrets/services/traefik/technitiumApiToken
  readOnly: true
- name: ca-certs
  mountPath: /tmp/ca-bundle.crt
  readOnly: true

certificatesResolvers:
  swigg-ca:
    acme:
      email: dustin@swigg.net
      storage: /tmp/acme.json
      dnsChallenge:
        provider: technitium
        resolvers: "10.1.2.32:53"
      caserver: "https://ca.core.infra.home/acme/system-acme/directory"

env:
- name: TECHNITIUM_API_TOKEN_FILE
  value: /run/secrets/services/traefik/technitiumApiToken
- name: TECHNITIUM_SERVER_BASE_URL
  value: "https://dns.core.infra.home"
- name: LEGO_CA_CERTIFICATES
  value: /tmp/ca-bundle.crt
- name: SSL_CERT_FILE
  value: /tmp/ca-bundle.crt

service:
  # -- Additional annotations applied to both TCP and UDP services (e.g. for cloud provider specific config)
  annotations:
    metallb.universe.tf/loadBalancerIPs: 10.1.41.2
