gateway:
  listeners:
    websecure:
      # -- Port is the network port. Multiple listeners may use the same port, subject to the Listener compatibility rules.
      # The port must match a port declared in ports section.
      port: 443

ingressRoute:
  dashboard:
    # -- Create an IngressRoute for the dashboard
    enabled: true
    # -- The router match rule used for the dashboard ingressRoute
    matchRule: Host(`traefik.k8s.home`)
    # -- Specify the allowed entrypoints to use for the dashboard ingress route, (e.g. traefik, web, websecure).
    # By default, it's using traefik entrypoint, which is not exposed.
    # /!\ Do not expose your dashboard without any protection over the internet /!\
    entryPoints: [ "traefik", "web", "websecure" ]

  healthcheck:
    # -- Create an IngressRoute for the healthcheck probe
    enabled: false
    matchRule: Host(`traefik.k8s.home`) && PathPrefix(`/ping`)
    entryPoints: [ "traefik", "web", "websecure" ]

providers:
  kubernetesCRD:
    # -- Allows IngressRoute to reference resources in namespace other than theirs
    allowCrossNamespace: true

deployment:
  # Two replicas, one per node (see topologySpreadConstraints below). This is
  # not only about availability. With a single replica the LoadBalancer VIP has
  # to be served across nodes whenever the Cilium L2 announcer lease sits on the
  # node that is not running traefik. In that state both nodes rev-NAT the VIP
  # and the client receives two conflicting SYN-ACKs, so the handshake is reset
  # and the DMZ proxy returns 502. Captured 2026-10-29: the client ACKed a
  # sequence number the announcing node had never sent, which that node then
  # correctly RST'd, and the TLS ClientHello was never sent. A backend on every
  # node removes the cross-node path entirely.
  replicas: 2
  additionalVolumes:
  - name: technitium-token
    hostPath:
      path: /run/secrets/services/traefik/technitiumApiToken
      type: File
  - name: ca-certs
    hostPath:
      path: /etc/ssl/certs/ca-bundle.crt
      type: File

additionalArguments:
- "--serverstransport.insecureskipverify=true"
- "--entrypoints.websecure.http.tls.certResolver=swigg-ca"
- "--entrypoints.websecure.http.tls.domains[0].main=k8s.home"
- "--entrypoints.websecure.http.tls.domains[0].sans=*.k8s.home"

additionalVolumeMounts:
- name: technitium-token
  mountPath: /run/secrets/services/traefik/technitiumApiToken
  readOnly: true
- name: ca-certs
  mountPath: /tmp/ca-bundle.crt
  readOnly: true

# KNOWN LIMITATION -- read this before adding replicas or debugging cert churn.
# Traefik CE has no distributed ACME storage, and acme.storage below is
# pod-local (the chart's `tmp` emptyDir, not a PVC), so EACH replica resolves
# its own certificate independently. With two replicas both run the same DNS-01
# challenge against Technitium for _acme-challenge.k8s.home and can clobber each
# other's TXT record, which surfaces as a failed challenge plus a retry while
# Traefik serves its self-signed default certificate.
#
# The blast radius is small in this topology: the DMZ proxy sets
# `proxy_ssl_verify off`, so everything arriving via *.swigg.net is unaffected.
# Only clients hitting *.k8s.home directly would see a warning during a race.
# Note the single-replica setup already re-issued on every pod restart, since
# the storage was always ephemeral -- this makes that more frequent, not new.
#
# The real fix is to stop Traefik doing ACME at all: let cert-manager (already
# installed, currently with zero issuers) own the wildcard and hand it to
# Traefik as a TLSStore default certificate. That needs a DNS-01 solver for
# Technitium, which cert-manager has no built-in support for -- it would mean a
# webhook solver or RFC2136 -- so it is deliberately out of scope here.
certificatesResolvers:
  swigg-ca:
    acme:
      email: dustin@swigg.net
      storage: /tmp/acme.json
      dnsChallenge:
        provider: technitium
        resolvers: "10.1.2.32:53"
      caserver: "https://ca.core.infra.home/acme/system-acme/directory"

env:
- name: TECHNITIUM_API_TOKEN_FILE
  value: /run/secrets/services/traefik/technitiumApiToken
- name: TECHNITIUM_SERVER_BASE_URL
  value: "https://dns.core.infra.home"
- name: LEGO_CA_CERTIFICATES
  value: /tmp/ca-bundle.crt
- name: SSL_CERT_FILE
  value: /tmp/ca-bundle.crt

service:
  # -- Additional annotations applied to both TCP and UDP services (e.g. for cloud provider specific config)
  annotations:
    # Pins the VIP out of the Cilium LB-IPAM pool; see
    # networking/cilium/manifests/cilium.loadbalancer-ip-pool.k8s-home.yaml.
    lbipam.cilium.io/ips: 10.1.41.2

# Keep the two replicas on separate nodes. DoNotSchedule rather than
# ScheduleAnyway on purpose: two pods landing on one node would recreate the
# cross-node VIP path this is meant to eliminate. During a single-node outage
# only one replica runs, which is the right trade -- the surviving pod is on the
# node that will hold the announcer lease anyway.
topologySpreadConstraints:
- maxSkew: 1
  topologyKey: kubernetes.io/hostname
  whenUnsatisfiable: DoNotSchedule
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-traefik

# Keep one replica serving through voluntary disruptions (node drain, rollout).
podDisruptionBudget:
  enabled: true
  minAvailable: 1
