apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- name: cilium
  namespace: kube-system
  includeCRDs: true
  releaseName: cilium
  version: 1.20.4
  repo: https://helm.cilium.io/
  additionalValuesFiles:
  - values.additional.yaml

resources:
- manifests/cilium.loadbalancer-ip-pool.k8s-home.yaml
- manifests/cilium.l2-announcement-policy.k8s-home.yaml
