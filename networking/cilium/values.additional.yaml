kubeProxyReplacement: true
k8sServiceHost: 10.1.40.32
k8sServicePort: 6443
# MetalLB owns LoadBalancer address allocation in this cluster (see
# networking/metallb). The Cilium chart defaults enableLBIPAM to true, which
# leaves two controllers willing to write .status.loadBalancer.ingress on the
# same Service. It only stays quiet today because no CiliumLoadBalancerIPPool
# exists; create one by accident and the two start fighting over traefik's
# 10.1.41.2.
enableLBIPAM: false

# Pin the eBPF datapath to an explicit device list rather than letting Cilium
# auto-detect it. With `devices` empty the managed set is recomputed on every
# netlink event, and each change drives a full datapath reload that re-links
# every native device (39 "Node addresses updated" events in one agent's log).
# The fabric VLANs (incus/k8s/k8s-svc-lb) all sit on br-fabric, which has a
# single physical uplink, so one NIC carrier flap takes all three down together
# and churns the device set. While that is in flight the LB program on
# k8s-svc-lb is detached, traffic to the MetalLB VIP (10.1.41.2) is no longer
# DNATed, and it falls through to the host stack -- which cannot ARP-resolve a
# VIP that MetalLB never assigns to an interface, so it blackholes and upstream
# proxies return 502. These four names are stable on every compute-infra host:
# VLAN netdevs are named after the VLAN key in the core.home inventory.
devices:
  - infra
  - incus
  - k8s
  - k8s-svc-lb
routingMode: "native"
ipv4NativeRoutingCIDR: "10.42.0.0/16"
autoDirectNodeRoutes: true
tunnelProtocol: ""
enableIPv4Masquerade: true
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4MaskSize: 24
    clusterPoolIPv4PodCIDRList:
      - "10.42.0.0/16"
hubble:
  relay:
    enabled: true
  ui:
    enabled: true
encryption:
  enabled: false
  type: wireguard
MTU: 8950
bpf:
  masquerade: true
