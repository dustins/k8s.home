---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: home.k8s.headlamp.ingressroute
  namespace: kube-system
spec:
  entryPoints:
    - websecure
  routes:
  - kind: Rule
    match: Host(`headlamp.k8s.home`)
    services:
    - name: headlamp
      namespace: kube-system
      port: 80
