apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
#namespace: argo-cd

helmCharts:
- name: argo-cd
  namespace: argocd
  includeCRDs: true
  releaseName: argocd
  version: 10.7.1
  repo: https://argoproj.github.io/argo-helm
  additionalValuesFiles:                                                                                           
  - values.additional.yaml

patches:
- target:
    kind: ConfigMap
    name: argocd-cm
  patch: |-
    - op: add
      path: /data/kustomize.buildOptions
      value: --enable-helm

resources:
- manifests/argocd.namespace.yaml
- manifests/argocd.ingressroute.yaml
