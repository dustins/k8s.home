---
# Tier: security — Cluster security: cert-manager, kubelet CSR approval
#
# One Argo CD Application per security/<app>/kustomization.yaml in this repo.
# The Application name is the app directory name (e.g. cilium) and the
# destination namespace is the Helm release namespace read from the
# kustomization's helmCharts entry, so adding or removing an app is just
# adding or removing a directory.
# Convention: every app directory is a kustomization with exactly one
# helmCharts entry (that is what every directory here does today).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: security
  namespace: argocd
spec:
  description: "Cluster security: cert-manager, kubelet CSR approval"
  sourceRepos:
  - ssh://forgejo@git.core.infra.home/dustins/k8s.home.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: security
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    # Deleting an app directory removes the Application but leaves the workload running.
    preserveResourcesOnDeletion: true
  generators:
  - git:
      repoURL: ssh://forgejo@git.core.infra.home/dustins/k8s.home.git
      revision: main
      files:
      - path: security/*/kustomization.yaml
  template:
    metadata:
      name: '{{ .path.basename }}'
      labels:
        k8s.home/tier: security
    spec:
      project: security
      source:
        repoURL: ssh://forgejo@git.core.infra.home/dustins/k8s.home.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ (index .helmCharts 0).namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        # Server-side apply: cilium and cert-manager CRDs are too large for the
        # client-side last-applied annotation (same reason the argocd install
        # command uses --server-side).
        - ServerSideApply=true
        - CreateNamespace=true
        - ApplyOutOfSyncOnly=true
        # CRDs and admission webhooks (metallb, cert-manager, traefik) race
        # their own CRs on a fresh cluster; retrying is what makes the
        # bootstrap converge without manual ordering.
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
