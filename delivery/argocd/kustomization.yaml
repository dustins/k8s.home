apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
#namespace: argo-cd

helmCharts:
- name: argo-cd
  namespace: argocd
  includeCRDs: true
  releaseName: argocd
  version: 10.9.2
  repo: https://argoproj.github.io/argo-helm
  additionalValuesFiles:                                                                                           
  - values.additional.yaml

patches:
- target:
    kind: ConfigMap
    name: argocd-cm
  patch: |-
    - op: add
      path: /data/kustomize.buildOptions
      value: --enable-helm

resources:
- manifests/argocd.namespace.yaml
- manifests/argocd.ingressroute.yaml
# One AppProject + ApplicationSet per tier directory of this repo. Argo CD
# applies these as part of managing itself; on a fresh cluster the argocd
# install command (see ./commands) applies them once to bootstrap.
- manifests/argocd.applicationset.networking.yaml
- manifests/argocd.applicationset.security.yaml
- manifests/argocd.applicationset.storage.yaml
- manifests/argocd.applicationset.observability.yaml
- manifests/argocd.applicationset.delivery.yaml
